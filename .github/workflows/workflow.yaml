name: Workflow

on: 
  push:
    branches:
      - 'main'
      - 'ci-debug'
    tags:
      - 'v*'
  pull_request:

jobs:

  ci:
    runs-on: ubuntu-latest
    name: CI (Linux amd64)
    steps:
      - uses: actions/checkout@v3
      - name: Build
        id: build
        run: .github/scripts/build-linux.sh
        env:
          PLATFORM_ARCH: amd64
      - name: Upload Artifact
        if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main' || github.ref_name == 'ci-debug'
        uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.build.outputs.filename }}
          path: ${{ steps.build.outputs.filename }}
          if-no-files-found: error

  create-release:
    name: Create Release
    needs: [ci]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Build Artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      - name: Calculate Variables
        id: vars
        run: |
          echo "ref_name_without_v=$(echo ${GITHUB_REF_NAME} | cut -c2-)" >>$GITHUB_OUTPUT
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v0.1.15
        with:
          draft: false
          prerelease: false
          name: skifree ${{ steps.vars.outputs.ref_name_without_v }}
          generate_release_notes: true
          files: |
            artifacts/**
